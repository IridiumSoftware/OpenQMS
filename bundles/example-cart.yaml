  - "ICH Q7"
  - "ICH Q9"
  - "ICH Q10"
  - "21 CFR 210"
  - "21 CFR 211"
  - "21 CFR Part 11"
  - "EudraLex Vol. 4"
  - "PIC/S Annex 1"
  - "EU GMP Annex 2A"
  - "EU GMP Annex 2B"
  - "21 CFR 1271"
  - "ICH Q5A(R2)"
  - "ISO/IEC 27001:2022"
  - "ISO 14001:2015"
  - "ISO 45001:2018"
  - "ISO 50001:2018"

modules:
