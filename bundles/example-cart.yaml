# Open QMS — example autologous CAR-T (ATMP) bundle definition
# -------------------------------------------------------------
# Demonstrates the ATMP class overlay end-to-end against an example
# autologous CD19-targeted CAR-T product manufactured at a US + EU
# dual-licensed cell therapy facility. Composes pharma + atmp +
# the full cross-cutting overlay stack — realistic shape for a
# commercial-stage cell therapy organization pursuing fully-
# integrated management system certification.

name: example-cart
product: ExampleAutologousCAR-T-CD19
