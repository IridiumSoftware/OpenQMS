    name: BPR Biocidal Product Authorisation Application (Articles 17-19 + Annex VI Common Principles + per-PT data requirements)
    addresses:
      - BPR-Art-17-product-authorisation
      - BPR-Art-19-conditions-of-authorisation
      - BPR-Annex-V-product-types
      - BPR-Annex-VI-evaluation-principles
