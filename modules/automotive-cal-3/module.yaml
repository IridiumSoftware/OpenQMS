# Open QMS — automotive CAL-3 class overlay (ISO/SAE 21434)
# ----------------------------------------------------------
# Composes with the automotive vertical to add ISO/SAE 21434
# Cybersecurity Assurance Level 3 (CAL-3). CAL-3 applies when the
# TARA identifies damage scenarios with mid-high impact-and-
# feasibility combinations (per Annex E CAL determination matrix).
#
# Use via:
#   openqms resolve --module automotive --module automotive-cal-3 ...
#
# CAL-3 specific rigor (delta from CAL-2 below and CAL-4 above):
#  - ISO/SAE 21434 §6.4.7 + Annex C: independent cybersecurity
#    assessment RECOMMENDED at CAL-3 (vs. optional at CAL-2,
#    required at CAL-4). When invoked, typically a different team
#    within the same organizational unit or external reviewer.
#  - ISO/SAE 21434 §10 + §13: V&V includes baseline security
#    functional + vulnerability scanning (CAL-2 baseline) plus
#    fuzz testing required. Penetration testing recommended.
#    Side-channel analysis NOT required (vs. required at CAL-4
#    where attack-feasibility analysis identifies side-channel
#    threats).
#  - ISO/SAE 21434 §11: vulnerability monitoring with formal
#    response-time commitments (e.g., "Critical CVEs patched
#    within N days; High within M days") documented in CSMS.
#    Incident-response playbooks defined (not necessarily
#    rehearsed — rehearsal is CAL-4 specific).
#  - Safety-security interaction: documented in Cybersecurity
#    Concept (Safety Concept Part C) when item is also ASIL-rated
#    (typically ASIL-B or ASIL-C at CAL-3 level).

name: automotive-cal-3-overlay
version: 0.1.0

standards:
  - ISO/SAE 21434:2021

clauses:

  - id: CAL-3-applicability
    standard: ISO/SAE 21434:2021
    section: "Annex E (informative)"
    summary: |
      CAL-3 applicability gate — invoked when TARA's
      impact-and-feasibility matrix yields CAL-3 (typically
      moderate-impact / high-feasibility, high-impact /
      moderate-feasibility, or moderate-impact / moderate-
      feasibility combinations). Documented in TARA.

  - id: CAL-3-recommended-independent-assessment
    standard: ISO/SAE 21434:2021
    section: "§6.4.7 + Annex C"
    summary: |
      Independent cybersecurity assessment RECOMMENDED at CAL-3.
      When invoked, typically a different team within the same
      organizational unit or external reviewer. The recommendation
      level is the major delta from CAL-2 (optional) and CAL-4
      (required).

  - id: CAL-3-V-and-V-fuzz
    standard: ISO/SAE 21434:2021
    section: "§10 + §13"
    summary: |
      V&V — CAL-3 includes baseline security functional testing
      and vulnerability scanning (CAL-2 baseline) PLUS fuzz
      testing required. Penetration testing recommended.
      Side-channel analysis not required at CAL-3 (vs. required
      where applicable at CAL-4).

  - id: CAL-3-formal-monitoring
    standard: ISO/SAE 21434:2021
    section: "§11"
    summary: |
      Continuous cybersecurity activities — CAL-3 requires
      formal vulnerability monitoring with response-time
      commitments documented in the CSMS (e.g., Critical CVEs
      patched within N days; High within M days). Defined
      incident-response playbooks (rehearsal recommended; CAL-4
      requires rehearsal).

  - id: CAL-3-safety-security-when-ASIL
    standard: ISO/SAE 21434:2021
    section: "§10 + cross-reference ISO 26262 Part 2 §6"
    summary: |
      Safety-security interaction analysis — when a CAL-3 item is
      also ASIL-rated (typically ASIL-B or ASIL-C), the
      Cybersecurity Concept must document the interaction:
      shared assets, common verification activities, divergent
      mitigations, FTTI vs. crypto-verification latency. Joint
      review by FuSa + cyber engineering.

templates:

  - path: templates/product-dhf/tara/TARA-TEMPLATE.md
    name: TARA — CAL-3 determination
    addresses:
      - CAL-3-applicability

  - path: templates/qms-sops/SOP-TEMPLATE.md
    name: Cybersecurity-plan SOP + formal vulnerability-monitoring SOP (CAL-3 scope — recommended-independent-assessment + response-time commitments)
    addresses:
      - CAL-3-recommended-independent-assessment
      - CAL-3-formal-monitoring

  - path: templates/product-sw/test/SOFTWARE-TEST-PROTOCOL-TEMPLATE.md
    name: Software test protocol — CAL-3 security functional + vulnerability scanning + fuzz testing required + pentest recommended
    addresses:
      - CAL-3-V-and-V-fuzz

  - path: templates/product-dhf/safety-concept/SAFETY-CONCEPT-TEMPLATE.md
    name: Safety Concept (Part C) — CAL-3 safety-security interaction analysis (when item is also ASIL-rated)
    addresses:
      - CAL-3-safety-security-when-ASIL
