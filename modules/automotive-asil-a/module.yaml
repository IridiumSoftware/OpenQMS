# Open QMS — automotive ASIL-A class overlay (ISO 26262)
# -------------------------------------------------------
# Composes with the automotive vertical to add ISO 26262 ASIL-A
# requirements. ASIL-A is the lowest non-QM tier, assigned for
# hazardous events with light severity / exposure / controllability
# combinations (e.g., S1 × E4 × C3; S1 × E3 × C3 yields QM, NOT
# ASIL-A — see Table 4). Common for non-life-critical but
# safety-relevant functions.
#
# Use via:
#   openqms resolve --module automotive --module automotive-asil-a ...
#
# ASIL-A specific rigor (delta from ASIL-B above and QM below):
#  - ISO 26262 Part 5 hardware metrics (Table 4 + 5 + 6):
#      SPFM: no quantitative target required at ASIL-A
#      LFM:  no quantitative target required at ASIL-A
#      PMHF < 10⁻⁶ failures/hour (vs. 10⁻⁷ at ASIL-B/C, 10⁻⁸ at ASIL-D)
#  - ISO 26262 Part 6 software structural coverage (Tables 12-15):
#      Unit testing: 100% statement only (branch + MC/DC recommended
#      but NOT required — the major delta from ASIL-B which requires
#      100% branch)
#      Integration:  100% function recommended
#  - ISO 26262 Part 2 §6 confirmation measures: I1 independence
#    (within the same team — different person). Lightest
#    independence tier short of QM.
#  - ISO 26262 Part 6 method recommendations: language subset
#    recommended (lighter than ASIL-B's recommended and far lighter
#    than ASIL-C/D's required); defensive programming + restricted
#    pointers recommended.

name: automotive-asil-a-overlay
version: 0.1.0

standards:
  - ISO 26262:2018

clauses:

  - id: ASIL-A-applicability
    standard: ISO 26262:2018
    section: "Part 3 §6 Table 4"
    summary: |
      ASIL-A applicability gate — invoked when HARA classifies a
      hazardous event at S1 × E4 × C3, S2 × E2 × C3, S2 × E3 × C2,
      or other (S, E, C) combinations yielding ASIL-A per Table 4.
      Note: S1 × E4 × C1 → QM, not ASIL-A; the classification
      requires both significant exposure and significant
      uncontrollability for ASIL-A allocation.

  - id: ASIL-A-HW-metrics
    standard: ISO 26262:2018
    section: "Part 5 §8-9 + Annex F"
    summary: |
      Hardware architectural metrics — ASIL-A requires PMHF < 10⁻⁶
      failures/hour but does NOT require quantitative SPFM or LFM
      targets. Lighter HW metrics than ASIL-B (90% / 60% / 10⁻⁷)
      and significantly lighter than ASIL-D (99% / 90% / 10⁻⁸).

  - id: ASIL-A-SW-coverage
    standard: ISO 26262:2018
    section: "Part 6 §9 + Tables 12, 13"
    summary: |
      Software structural coverage — ASIL-A requires 100% statement
      coverage at the unit-test level. Branch coverage is
      recommended; MC/DC is recommended. Major delta from ASIL-B
      which requires 100% branch (mandatory).

  - id: ASIL-A-confirmation-I1
    standard: ISO 26262:2018
    section: "Part 2 §6 + Table 1"
    summary: |
      Confirmation measures with I1 independence — ASIL-A requires
      confirmation review by a different person within the same
      team. Lightest independence tier short of QM (which requires
      no FuSa-specific independence). FuSa audit + assessment may
      be combined or scaled down per Part 2 §6 scaling rules.

  - id: ASIL-A-SW-methods
    standard: ISO 26262:2018
    section: "Part 6 §5 + Tables 1-3"
    summary: |
      Software design + coding method requirements — ASIL-A
      recommends use of a language subset (e.g., MISRA C 2012
      mandatory rules subset), defensive programming, restricted
      pointer use. All recommended-not-required at ASIL-A.

templates:

  - path: templates/product-dhf/safety-concept/SAFETY-CONCEPT-TEMPLATE.md
    name: Safety Concept — ASIL-A allocations
    addresses:
      - ASIL-A-applicability

  - path: templates/product-dhf/verification/VERIFICATION-PROTOCOL-TEMPLATE.md
    name: Verification protocol — ASIL-A HW (PMHF < 10⁻⁶/h; no quantitative SPFM/LFM)
    addresses:
      - ASIL-A-HW-metrics

  - path: templates/product-sw/test/SOFTWARE-TEST-PROTOCOL-TEMPLATE.md
    name: Software test protocol — ASIL-A 100% statement coverage (branch + MC/DC recommended)
    addresses:
      - ASIL-A-SW-coverage

  - path: templates/qms-sops/SOP-TEMPLATE.md
    name: Confirmation-measures SOP + SW design/coding standards (ASIL-A I1 independence + MISRA C recommended)
    addresses:
      - ASIL-A-confirmation-I1
      - ASIL-A-SW-methods
