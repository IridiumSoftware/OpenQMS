# Open QMS — validation-package-eu market overlay (P2.3)
# EU market dial for the P2 validation family. Refines the neutral
# validation-package baseline with the EU regulatory framing: the ISO 13485
# §7.5.6/§7.6 backbone (device QMS computerized systems under MDR Annex IX)
# plus EU GMP Annex 11 (Computerised Systems) + Annex 15 (Qualification and
# Validation), risk-managed per ICH Q9. Compose with the baseline:
#   openqms validate --module validation-package --module validation-package-eu
#
# "CSA" is an FDA construct not used in the EU; this overlay frames the same
# risk-based spine in Annex 11/15 + ISO 13485 language. Rigor remains a
# per-function determination output (classic CSV / robust scripted = the
# Annex 15 DQ/IQ/OQ/PQ qualification path). Compose with validation-package-
# fda as well for US+EU products. See companion_p2_validation_package.md.
#
# Standards licensing: EudraLex Annexes + ICH guidelines are public; ISO
# 13485 is commercial. Summaries are paraphrases (OQ-070).

name: validation-package-eu
version: 0.1.0

standards:
  - ISO 13485:2016
  - EU GMP Annex 11
  - EU GMP Annex 15
  - ICH Q9

clauses:
  - id: VALEU-VALIDATION
    standard: ISO 13485:2016
    section: "7.5.6"
    summary: |
      Validate computer software used in production and service provision
      proportionate to risk — prior to initial use and, as appropriate,
      after changes to the software or its application.

  - id: VALEU-MM-SOFTWARE
    standard: ISO 13485:2016
    section: "7.6"
    summary: |
      Validate software used in the monitoring and measurement of
      requirements prior to initial use and as necessary after changes.

  - id: VALEU-ANNEX11-RISK
    standard: EU GMP Annex 11
    section: "§1 Risk management"
    summary: |
      Apply risk management across the system life cycle; base decisions on
      the extent of validation and on data-integrity controls on a justified
      and documented risk assessment (aligned with ICH Q9).

  - id: VALEU-ANNEX11-LIFECYCLE
    standard: EU GMP Annex 11
    section: "§4 Validation"
    summary: |
      Maintain validation documentation and change control across the life
      cycle; keep an up-to-date inventory of relevant systems; describe
      required functionality in a risk-assessed user requirements
      specification that is traceable throughout the life cycle.

  - id: VALEU-ANNEX11-DATA-INTEGRITY
    standard: EU GMP Annex 11
    section: "§5–9, §12 Data and security"
    summary: |
      Build in accuracy checks for critical data, secure storage with
      backup, audit trails capturing GMP-relevant changes and deletions, and
      access controls limiting system access to authorized individuals.

  - id: VALEU-ANNEX11-ESIG
    standard: EU GMP Annex 11
    section: "§14 Electronic signatures"
    summary: |
      Where used, electronic signatures are permanently linked to their
      respective records and include the time and date that they were
      applied.

  - id: VALEU-ANNEX15-QUALIFICATION
    standard: EU GMP Annex 15
    section: "Qualification DQ/IQ/OQ/PQ"
    summary: |
      Perform qualification through the defined stages — design, installation,
      operational, and performance qualification — under a validation master
      plan, with change control and revalidation triggered by risk-assessed
      change.

  - id: VALEU-QRM
    standard: ICH Q9
    section: "Quality Risk Management"
    summary: |
      Use quality risk management as the basis for determining the
      proportionate extent of validation effort and for ongoing review of
      the validated state.

templates:
  - path: templates/qms-validation/SYSTEM-INVENTORY-TEMPLATE.md
    name: Computerized system inventory (EU GMP Annex 11 overlay binding)
    addresses:
      - VALEU-ANNEX11-LIFECYCLE

  - path: templates/qms-validation/ASSURANCE-DETERMINATION-TEMPLATE.md
    name: Assurance determination (EU Annex 11 + ICH Q9 overlay binding)
    addresses:
      - VALEU-ANNEX11-RISK
      - VALEU-QRM

  - path: templates/qms-validation/ASSURANCE-RECORD-TEMPLATE.md
    name: Assurance record (ISO 13485 overlay binding)
    addresses:
      - VALEU-VALIDATION
      - VALEU-MM-SOFTWARE

  - path: templates/qms-validation/VALIDATION-MASTER-PLAN-TEMPLATE.md
    name: Validation master plan (EU GMP Annex 15 overlay binding)
    addresses:
      - VALEU-ANNEX15-QUALIFICATION

  - path: templates/qms-validation/CHANGE-ASSESSMENT-TEMPLATE.md
    name: Change assessment (EU GMP Annex 15 overlay binding)
    addresses:
      - VALEU-ANNEX15-QUALIFICATION

  - path: templates/qms-validation/ELECTRONIC-RECORDS-CONTROLS-TEMPLATE.md
    name: Electronic records and signature controls (EU GMP Annex 11 overlay binding)
    addresses:
      - VALEU-ANNEX11-DATA-INTEGRITY
      - VALEU-ANNEX11-ESIG

  - path: templates/qms-validation/QUALIFICATION-PROTOCOL-TEMPLATE.md
    name: Qualification protocol (DQ/IQ/OQ/PQ)
    addresses:
      - VALEU-ANNEX15-QUALIFICATION
