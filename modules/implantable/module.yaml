# Open QMS — Implantable medical device category overlay
# -------------------------------------------------------
# Composes with the medical-devices vertical to add implantable-specific
# requirements: implant card (EU MDR Annex I §23.4), SSCP (EU MDR
# Article 32), active-implantable additional standards (ISO 14708 series
# when the device is active-implantable).
#
# Use via:
#   openqms resolve --module medical-devices --module implantable ...
#
# Most implantables are EU MDR Class IIb or III. Adopters typically
# compose this overlay with mdr-class-iii (or future mdr-class-iib)
# overlays for the regulatory-path-specific requirements.

name: implantable-overlay
version: 0.1.0

standards:
  - ISO 14708-1:2014
  - EU MDR 2017/745

clauses:

  - id: MDR-AnnexI-23.4
    standard: EU MDR 2017/745
    section: "Annex I §23.4"
    summary: |
      Information for patients with implants — implant card provided to
      patients containing device identification, particular hazards,
      precautions, expected lifetime, post-implant care guidance, contact
      details. Subset of Annex I GSPR §23 (information supplied with the
      device); isolated as a separate clause for implantable-specific
      traceability.

  - id: MDR-Art32
    standard: EU MDR 2017/745
    section: "Article 32"
    summary: |
      Summary of Safety and Clinical Performance (SSCP) — for Class III
      devices and implantable devices (other than custom-made or
      investigational), the manufacturer shall draw up an SSCP. Written
      for the patient and the healthcare professional separately,
      published on EUDAMED, kept up to date throughout the device
      lifecycle.

  - id: ISO14708-1-active-implantable
    standard: ISO 14708-1:2014
    section: "all"
    summary: |
      Active implantable medical devices — general requirements: safety,
      essential performance, marking, packaging, accompanying documents.
      Applies to devices intended to be totally or partially
      implanted and which depend on a source of power other than that
      generated by the body or gravity. Does not apply to non-active
      implants.

templates:

  - path: templates/product-dhf/implant/IMPLANT-CARD-TEMPLATE.md
    name: Implant card template (EU MDR Annex I §23.4)
    addresses:
      - MDR-AnnexI-23.4

  - path: templates/product-dhf/implant/SSCP-TEMPLATE.md
    name: Summary of Safety and Clinical Performance template (EU MDR Article 32)
    addresses:
      - MDR-Art32

  - path: templates/product-dhf/verification/VERIFICATION-PROTOCOL-TEMPLATE.md
    name: Verification protocol (active-implantable testing per ISO 14708-1)
    addresses:
      - ISO14708-1-active-implantable
