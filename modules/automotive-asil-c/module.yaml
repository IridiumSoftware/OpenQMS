# Open QMS — automotive ASIL-C class overlay (ISO 26262)
# -------------------------------------------------------
# Composes with the automotive vertical to add ISO 26262 ASIL-C
# requirements. ASIL-C is assigned for hazardous events with high
# severity / exposure / controllability combinations short of ASIL-D
# (e.g., S3 × E4 × C2; S3 × E3 × C3; S2 × E4 × C3 per Part 3 §6
# Table 4). Common for high-rigor production functions that fall
# below ASIL-D-only items.
#
# Use via:
#   openqms resolve --module automotive --module automotive-asil-c ...
#
# ASIL-C specific rigor (delta from ASIL-D above and ASIL-B below):
#  - ISO 26262 Part 5 hardware metrics (Table 4 + 5 + 6):
#      SPFM ≥ 97%   (vs. 99% at ASIL-D, 90% at ASIL-B)
#      LFM  ≥ 80%   (vs. 90% at ASIL-D, 60% at ASIL-B)
#      PMHF < 10⁻⁷ failures/hour (same as ASIL-B; tighter than 10⁻⁶
#      at ASIL-A; vs. 10⁻⁸ at ASIL-D)
#  - ISO 26262 Part 6 software structural coverage (Tables 12-15):
#      Unit testing: 100% statement + 100% branch (NOT MC/DC; same
#      as ASIL-B); MC/DC is recommended at ASIL-C
#      Integration:  100% function + recommended function-call coverage
#  - ISO 26262 Part 2 §6 confirmation measures: I3 independence
#    (same as ASIL-D — different organizational unit). The
#    independence requirement is the major delta from ASIL-B.
#  - ISO 26262 Part 6 method recommendations (Tables 1-3): MISRA C
#    2012 mandatory + required rules expected; language subset
#    REQUIRED (not recommended as at ASIL-B); defensive programming
#    required.

name: automotive-asil-c-overlay
version: 0.1.0

standards:
  - ISO 26262:2018

clauses:

  - id: ASIL-C-applicability
    standard: ISO 26262:2018
    section: "Part 3 §6 Table 4"
    summary: |
      ASIL-C applicability gate — invoked when HARA classifies a
      hazardous event at S3 × E4 × C2, S3 × E3 × C3, S2 × E4 × C3,
      or other (S, E, C) combinations yielding ASIL-C per Table 4.
      Documented in HARA and FSC.

  - id: ASIL-C-HW-metrics
    standard: ISO 26262:2018
    section: "Part 5 §8-9 + Annex F"
    summary: |
      Hardware architectural metrics — ASIL-C requires SPFM ≥ 97%,
      LFM ≥ 80%, PMHF < 10⁻⁷ failures/hour. Mid-high between
      ASIL-D (99% / 90% / 10⁻⁸) and ASIL-B (90% / 60% / 10⁻⁷).

  - id: ASIL-C-SW-coverage
    standard: ISO 26262:2018
    section: "Part 6 §9 + Tables 12, 13"
    summary: |
      Software structural coverage — ASIL-C requires 100% statement
      + 100% branch at the unit-test level (Table 12). MC/DC is
      recommended (the major delta from ASIL-D which mandates it,
      and from ASIL-B which recommends-not-mandates branch only).

  - id: ASIL-C-confirmation-I3
    standard: ISO 26262:2018
    section: "Part 2 §6 + Table 1"
    summary: |
      Confirmation measures with I3 independence — ASIL-C requires
      confirmation review, FuSa audit, FuSa assessment by reviewers
      from a different organizational unit (same as ASIL-D). The
      I3 minimum is the major confirmation-measures delta from
      ASIL-B (I2 — different team within the same organizational
      unit).

  - id: ASIL-C-SW-methods
    standard: ISO 26262:2018
    section: "Part 6 §5 + Tables 1-3"
    summary: |
      Software design + coding method requirements — ASIL-C
      requires use of a language subset (e.g., MISRA C 2012
      mandatory + required rules) — language subset is REQUIRED
      at ASIL-C (vs. recommended at ASIL-B). Defensive programming
      + restricted pointers + restricted dynamic memory required.

templates:

  - path: templates/product-dhf/safety-concept/SAFETY-CONCEPT-TEMPLATE.md
    name: Safety Concept — ASIL-C allocations
    addresses:
      - ASIL-C-applicability

  - path: templates/product-dhf/verification/VERIFICATION-PROTOCOL-TEMPLATE.md
    name: Verification protocol — ASIL-C HW metrics (SPFM ≥ 97% / LFM ≥ 80% / PMHF < 10⁻⁷/h)
    addresses:
      - ASIL-C-HW-metrics

  - path: templates/product-sw/test/SOFTWARE-TEST-PROTOCOL-TEMPLATE.md
    name: Software test protocol — ASIL-C 100% statement + 100% branch (MC/DC recommended)
    addresses:
      - ASIL-C-SW-coverage

  - path: templates/qms-sops/SOP-TEMPLATE.md
    name: Confirmation-measures SOP + SW design/coding standards (ASIL-C I3 independence + MISRA C 2012 required)
    addresses:
      - ASIL-C-confirmation-I3
      - ASIL-C-SW-methods
