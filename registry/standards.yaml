# Open QMS standards registry
# ----------------------------
# Lists every standard / regulation / program the engine knows about, with
# metadata (publisher, edition, license kind, accepted aliases). CLI
# --standard arguments are normalized to canonical `id` values via this
# registry; unregistered standards raise rather than silently filtering to
# empty resolution. Module manifests' standards: lists and per-clause
# standard: fields are likewise validated against this registry.
#
# Standards licensing: this file contains canonical identifiers and
# normative metadata only. The standard texts themselves are not
# redistributed here. Adopters must obtain licensed copies of any
# commercially-published standard per the publishers' license terms.
#
# To add a standard: open a PR with a new entry below. Every entry must
# carry id, name, publisher, edition, kind, license_kind. Optional fields:
# aliases (list of strings); superseded_by (canonical id of the newer
# edition that supersedes this entry — used by --strict-editions and the
# regenerate workflow to detect module-version drift, OQ-065).

