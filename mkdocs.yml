site_name: Open QMS
site_description: Open-source GitHub-native QMS generator — 120 modules across 8 verticals + 26 cross-cutting overlays + 26 sub-overlays + 12 cross-overlays; clause-to-template traceability invariant; v0.70.0
repo_url: https://github.com/IridiumSoftware/open-qms
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md

  - For evaluators:
    - Compliance architecture (trust gate): compliance-architecture.md
    - Modules catalog: modules-catalog.md

  - Getting started:
    - Quick start: guide/quickstart.md
    - Onboarding (first 30 days): guide/onboarding.md
    - Configuration: guide/configuration.md

  - Role guides:
    - Quality Manager: guide/role-quality-manager.md
    - Engineer: guide/role-engineer.md
    - Auditor walkthrough: guide/auditor-walkthrough.md

  - Workflows:
    - Document control: guide/doc-control.md
    - Document routing (CODEOWNERS): guide/document-routing.md
    - CAPA lifecycle: guide/capa-lifecycle.md
    - Traceability (clause-level): guide/traceability.md
    - Instance-level traceability (P15): guide/instance-traceability.md
    - Training: guide/training.md
    - Supplier controls: guide/supplier-controls.md
    - Management review: guide/management-review.md
    - Complaints: guide/complaints.md
    - Signature meaning (§11.50): guide/signature-meaning.md
    - GPG signing: guide/gpg-signing.md
    - Release management: guide/release.md
    - Verify deployment: guide/verify-deployment.md

  - Computerized-system validation:
    - Overview (CSA / Part 11 / Annex 11): guide/validation-package.md
    - Worked example — Open QMS self-validation: examples/openqms-self-validation.md

  - Schemas + maturity:
    - Template frontmatter schema: guide/template-frontmatter.md
    - Maturity model (startup-stage presets): guide/maturity-model.md

  - Regulatory reference:
    - Overview: regulatory/overview.md
    - Medical devices: regulatory/medical-devices.md
    - Finance (SOX / ICFR): guide/finance-sox-icfr.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - toc:
      permalink: true

plugins:
  - search
