# Open QMS — seed startup preset
# -------------------------------
# Opinionated QMS scaffold for a seed-stage startup.
# Assumes: 5-15 people, first paying customers, regulator on horizon,
# vertical mostly chosen (placeholder: manufacturing).
#
# What's added over pre-seed: privacy (GDPR + CCPA) + anti-bribery
# governance + BCMS substrate + first vertical (manufacturing as
# placeholder — adopters swap for their actual vertical:
# medical-devices, pharma, aerospace, automotive, food-safety,
# chemicals).
#
# What's still NOT in: SOC 2 (no auditor engagement yet), sub-overlays
# (no cloud or PIMS specificity yet), cross-overlays, sector
# compliance frameworks.
#
# Graduate to `series-a` when: SOC 2 Type II becomes a customer
# requirement OR you cross 15 employees OR you pursue your first formal
# certification (ISO 9001 audit, MDSAP audit, etc.).
#
# See presets/seed-README.md for the full IN/OUT/graduate rationale.

name: seed
product: Seed-Startup

jurisdictions: []

standards:
  - "CCPA"
  - "GDPR"
  - "ISO 14001:2015"
  - "ISO 22301:2019"
  - "ISO 31000:2018"
  - "ISO 37001:2016"
  - "ISO 45001:2018"
  - "ISO 50001:2018"
  - "ISO 9001:2015"
  - "ISO/IEC 27001:2022"

modules:
  - iso-31000
  - iso-27001
  - integrated-management-system
  - privacy
  - iso-37001
  - iso-22301
  - manufacturing
