# Open QMS — Series B+ startup preset
# ------------------------------------
# Opinionated QMS scaffold for a Series B+ startup.
# Assumes: 50-200+ people, multi-jurisdiction operations, regulator-
# engaged, multiple formal certifications maintained in parallel,
# compliance function exists as named org unit.
#
# What's added over series-a: HITRUST (CSF + i1 intermediate scoping)
# + NIST CSF 2.0 with tier-3 (Repeatable) maturity + ISO 37301
# compliance management substrate + ISO 37301 general-business
# sectoral profile + ISO 50001 energy management.
#
# What's still NOT in (because vertical-specific or jurisdiction-
# specific): EU-specific frameworks (DORA, NIS2, EU MDR/IVDR/AI Act),
# US-sector-specific (HIPAA, FFIEC, NERC CIP, CMMC), specific
# cross-overlays (banking-resilience, utility-cybersecurity,
# clinical-trial-multi-region, etc.). Adopters layer these on top
# based on actual business scope.
#
# This is the largest startup-stage preset. Beyond series-b-plus the
# composition is too organization-specific to predict; adopters use
# this as the foundation and add vertical-overlays + cross-overlays
# explicitly.
#
# See presets/series-b-plus-README.md for the full IN/OUT/graduate
# rationale + suggested layering pointers for common vertical paths.

