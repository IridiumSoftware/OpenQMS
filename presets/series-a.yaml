# Open QMS — Series A startup preset
# -----------------------------------
# Opinionated QMS scaffold for a Series A startup.
# Assumes: 15-50 people, scaling rapidly, certifications becoming
# materially required by customers + regulators.
#
# What's added over seed: SOC 2 Type II (point-in-time + observation-
# period sub-overlays) + IS sub-overlays for cloud (ISO 27017) and
# privacy management (ISO 27701 PIMS) + environmental (ISO 14001) and
# OH&S (ISO 45001) MS for physical operations + cross-vertical
# recall-workflow.
#
# What's still NOT in: HITRUST, NIST CSF, ISO 37301 compliance MS,
# energy MS, multi-jurisdiction cross-overlays. Those come at
# series-b-plus.
#
# Graduate to `series-b-plus` when: HITRUST i1 or r2 attestation
# becomes a customer requirement OR you cross 50 employees OR you
# enter your first non-home-jurisdiction regulatory market OR you
# pursue NIST CSF tier-3+ maturity.
#
# See presets/series-a-README.md for the full IN/OUT/graduate rationale.

