name: Regulatory Review (per-module)
description: Independent qualified-reviewer review of a module's clause crosswalk per BUSINESS/regulatory_review_cadence.md
labels: ["regulatory-review", "module-attestation"]
body:
  - type: markdown
    attributes:
      value: |
        Per-module regulatory review per `BUSINESS/regulatory_review_cadence.md`.

        Reviewer must be qualified per the §2 criteria (active regulatory professional / standards-body member / certification-body auditor / FDA Investigator / clinical-QA consultant / academic with peer-reviewed publications).

        Output: a finding-log file at `BUSINESS/regulatory_reviews/<module>_<reviewer-org>_<YYYY-MM-DD>.md` + module README badge update.

  - type: input
    id: module_name
    attributes:
      label: Module name
      placeholder: "medical-devices"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: Module version (from module.yaml)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: standards_reviewed
    attributes:
      label: Standards reviewed
      description: List each standard ID covered in this review
      placeholder: |
        - ISO 13485:2016
        - 21 CFR 820
        - ISO 14971:2019
    validations:
      required: true

  - type: dropdown
    id: review_method
    attributes:
      label: Review method
      options:
        - Clause-by-clause (exhaustive)
        - Sample-N-clauses (justify N in finding log)
        - Delta-from-prior-review (changes since last review)
    validations:
      required: true

  - type: input
    id: prior_review_ref
    attributes:
      label: Prior review reference (if delta method)
      placeholder: "BUSINESS/regulatory_reviews/medical-devices_BSI_2025-05-25.md (or 'none')"

  - type: input
    id: reviewer_name
    attributes:
      label: Reviewer name
      placeholder: "Jane Doe"
    validations:
      required: true

  - type: input
    id: reviewer_org
    attributes:
      label: Reviewer organization
      placeholder: "BSI / TÜV / FDA / Independent / etc."
    validations:
      required: true

  - type: dropdown
    id: reviewer_qualification
    attributes:
      label: Reviewer qualification criterion (from regulatory_review_cadence.md §2)
      options:
        - Active regulatory professional (≥5 years)
        - Standards-development body member
        - Notified-body / certification-body auditor
        - Practicing FDA Investigator
        - Clinical/quality consultant (≥3 closed submissions)
        - Academic with peer-reviewed publications
    validations:
      required: true

  - type: textarea
    id: qualification_evidence
    attributes:
      label: Qualification evidence
      description: Certification ID + expiry / publication cite / NDA-permitted statement
      placeholder: "RAC certification #12345, expires 2027-12-31 (verified via RAPS)"
    validations:
      required: true

  - type: dropdown
    id: overall_attestation
    attributes:
      label: Overall attestation
      options:
        - adequate
        - adequate-with-minor-findings
        - adequate-with-major-findings
        - not-adequate
        - scope-revision-required
    validations:
      required: true

  - type: textarea
    id: findings_summary
    attributes:
      label: Findings summary (count by severity)
      placeholder: |
        - minor: 2
        - major: 0
        - critical: 0
        Detailed findings in finding-log file.
    validations:
      required: true

  - type: input
    id: finding_log_path
    attributes:
      label: Finding-log file path
      placeholder: "BUSINESS/regulatory_reviews/medical-devices_BSI_2026-05-25.md"
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Attestation
      options:
        - label: Finding-log file follows the schema in regulatory_review_cadence.md §3
          required: true
        - label: Module README badge updated with last-reviewed date + attestation + next-review-due + log link
          required: true
        - label: Major or critical findings have been or will be addressed within the SOP-specified response window (30 days critical / 90 days major)
          required: true
        - label: Close commit will include `Signature-Meaning: Reviewed` trailer
          required: true
