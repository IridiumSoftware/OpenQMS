name: Engine tests

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'modules/**'
      - 'templates/**'
      - 'registry/**'
      - 'bundles/**'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'modules/**'
      - 'templates/**'
      - 'registry/**'
      - 'bundles/**'
      - '.github/workflows/engine-tests.yml'

jobs:
  test:
    name: pytest + module validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e './engine[dev]'

      - name: Run pytest
        run: pytest engine/tests -v

      - name: Validate shipped regulatory modules
        run: |
          openqms validate --module medical-devices
          openqms validate --module iso-27001
          openqms validate --module aerospace
          openqms validate --module automotive
          openqms validate --module regulated-ai
          openqms validate --module medical-devices --module iso-27001
          openqms validate --module aerospace --module regulated-ai --module iso-27001
          openqms validate --module automotive --module regulated-ai --module iso-27001
          # Aerospace DAL class overlays
          openqms validate --module aerospace --module aerospace-dal-a
          openqms validate --module aerospace --module aerospace-dal-b
          openqms validate --module aerospace --module aerospace-dal-c
          # Automotive ASIL + CAL class overlays
          openqms validate --module automotive --module automotive-asil-d
          openqms validate --module automotive --module automotive-asil-b
          openqms validate --module automotive --module automotive-cal-4
          # Top-rigor mega-composite — safety-critical + cyber-critical ML-enabled ECU
          openqms validate --module automotive --module automotive-asil-d --module automotive-cal-4 --module regulated-ai --module iso-27001

      - name: Inspect registry (smoke check)
        run: openqms registry list

      - name: Regenerate example bundles (dry-run regression check)
        # Exits 1 if any matrix has drifted from its committed baseline.
        # If this fails, either revert the offending module/registry/template
        # change or run `openqms regenerate --bundle <name> --write-matrix`
        # and commit the resulting matrix file.
        run: |
          openqms regenerate --bundle example-samd
          openqms regenerate --bundle example-aircraft
          openqms regenerate --bundle example-vehicle

      - name: Signatures export (smoke check)
        # Walks the repo's own git log and emits a signature audit trail.
        # OpenQMS doesn't enforce Signature-Meaning trailers on its own
        # commits today, so the trail may be empty — this step exercises
        # the engine code path and surfaces parse errors.
        run: openqms signatures export --output /tmp/openqms-signatures.json
