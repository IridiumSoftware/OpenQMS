name: Engine tests

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'modules/**'
      - 'templates/**'
      - 'registry/**'
      - 'bundles/**'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'modules/**'
      - 'templates/**'
      - 'registry/**'
      - 'bundles/**'
      - '.github/workflows/engine-tests.yml'

jobs:
  test:
    name: pytest + module validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.11.7'

      - name: Verify lockfile is present (P6 gate)
        # The lockfile MUST be present for reproducible installs. If
        # engine/uv.lock is missing, this commit breaks the
        # pinned-deps discipline added at v0.55.0 (compliance-
        # architecture P6) and CI must fail loudly rather than fall
        # back to floor-version resolution.
        run: test -f engine/uv.lock || (echo "engine/uv.lock missing — see docs/compliance-architecture.md §forward-work P6"; exit 1)

      - name: Install engine + dev deps (hashed via uv.lock)
        # uv sync installs the exact pinned + hashed versions in
        # engine/uv.lock. No floor-version drift; CI re-runs are
        # bit-identical wrt deps. Editable install of the engine
        # itself via uv pip install -e for test discoverability.
        run: |
          cd engine
          uv sync --frozen --all-extras
          uv pip install -e '.[dev]'
          # Put the uv-created venv on PATH so the later steps' bare
          # `python3` / `pytest` / `openqms` resolve to it (uv installs
          # into engine/.venv, not the system Python). Without this, the
          # lint steps fail with ModuleNotFoundError: No module named 'yaml'.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint module.yaml files
        # Catches the YAML failure modes observed in the v0.36-v0.38
        # chemicals arc — most notably unquoted colon-space patterns in
        # template `name:` values that broke parse in
        # transport-hazmat/module.yaml. Also asserts every clause has
        # the required fields + every template's addresses entries
        # refer to in-module clause ids.
        run: python3 scripts/lint-module-yaml.py

      - name: Lint template frontmatter (P9 gate)
        # Added at v0.58.0 (compliance-architecture forward work P9).
        # Validates every templates/**/*.md against the schema in
        # engine/openqms/template_schema.py. Required fields:
        # document_id + version + owner + status + one of
        # (effective_date | issued_date | issue_date | opened_date |
        # assessment_date | notification_date | approval_date). Hard
        # fail mode: missing frontmatter or schema violation exits 1.
        run: python3 scripts/lint-template-frontmatter.py

      - name: Run pytest
        run: pytest engine/tests -v

      - name: Validate shipped regulatory modules
        run: |
          openqms validate --module medical-devices
          openqms validate --module iso-27001
          openqms validate --module aerospace
          openqms validate --module automotive
          openqms validate --module regulated-ai
          openqms validate --module medical-devices --module iso-27001
          openqms validate --module aerospace --module regulated-ai --module iso-27001
          openqms validate --module automotive --module regulated-ai --module iso-27001
          # Aerospace DAL class overlays (full set: A through E)
          openqms validate --module aerospace --module aerospace-dal-a
          openqms validate --module aerospace --module aerospace-dal-b
          openqms validate --module aerospace --module aerospace-dal-c
          openqms validate --module aerospace --module aerospace-dal-d
          openqms validate --module aerospace --module aerospace-dal-e
          # Automotive ASIL class overlays (full set: D, C, B, A, QM)
          openqms validate --module automotive --module automotive-asil-d
          openqms validate --module automotive --module automotive-asil-c
          openqms validate --module automotive --module automotive-asil-b
          openqms validate --module automotive --module automotive-asil-a
          openqms validate --module automotive --module automotive-qm
          # Automotive CAL class overlays (full set: 4, 3, 2, 1)
          openqms validate --module automotive --module automotive-cal-4
          openqms validate --module automotive --module automotive-cal-3
          openqms validate --module automotive --module automotive-cal-2
          openqms validate --module automotive --module automotive-cal-1
          # Manufacturing vertical (ISO 9001 only — general non-regulated manufacturing)
          openqms validate --module manufacturing
          openqms validate --module manufacturing --module iso-27001
          # HSE + energy cross-cutting overlays (each composes with any vertical)
          openqms validate --module iso-14001
          openqms validate --module iso-45001
          openqms validate --module iso-50001
          openqms validate --module medical-devices --module iso-14001 --module iso-45001
          openqms validate --module aerospace --module iso-14001 --module iso-45001
          openqms validate --module automotive --module iso-14001 --module iso-45001 --module iso-50001
          openqms validate --module manufacturing --module iso-14001 --module iso-45001 --module iso-50001
          # Pharma vertical (5th vertical) + composites
          openqms validate --module pharma
          openqms validate --module medical-devices --module pharma
          openqms validate --module pharma --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001
          # Food safety vertical (6th vertical) + composites
          openqms validate --module food-safety
          openqms validate --module food-safety --module iso-27001 --module iso-14001 --module iso-45001 --module iso-50001
          # Anti-bribery (ISO 37001) + business continuity (ISO 22301) cross-cutting overlays
          openqms validate --module iso-37001
          openqms validate --module iso-22301
          openqms validate --module manufacturing --module iso-37001 --module iso-22301
          openqms validate --module pharma --module iso-37001 --module iso-22301
          # 8-module ultimate-composite — pharma + 7 cross-cutting management-system overlays
          openqms validate --module pharma --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301
          # ATMP class overlay (cell + gene therapy) — composes with pharma vertical
          openqms validate --module pharma --module atmp
          # 9-module deepest-composite — ATMP cell+gene-therapy manufacturer with full IMS
          openqms validate --module pharma --module atmp --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301
          # Recall workflow (cross-cutting) — composes with auto + med-dev + food + manufacturing
          openqms validate --module recall-workflow
          openqms validate --module automotive --module recall-workflow
          openqms validate --module medical-devices --module recall-workflow
          openqms validate --module manufacturing --module recall-workflow
          openqms validate --module food-safety --module recall-workflow
          # 10-module deepest-composite (automotive top-rigor + recall + 5 cross-cutting + BCMS)
          openqms validate --module automotive --module automotive-asil-d --module automotive-cal-4 --module recall-workflow --module regulated-ai --module iso-27001 --module iso-14001 --module iso-45001 --module iso-50001 --module iso-22301
          # v0.28.0 — pharma class overlays (5)
          openqms validate --module pharma --module pharma-sterile
          openqms validate --module pharma --module pharma-biologics
          openqms validate --module pharma --module pharma-imp
          openqms validate --module pharma --module pharma-generic-biosimilar
          openqms validate --module pharma --module pharma-clinical-stage
          # v0.29.0 — food-safety class overlays (5)
          openqms validate --module food-safety --module food-usda-fsis
          openqms validate --module food-safety --module food-animal
          openqms validate --module food-safety --module food-produce-safety
          openqms validate --module food-safety --module food-intentional-adulteration
          openqms validate --module food-safety --module food-fsvp
          # v0.30.0 — aero/auto extension + IVDR class overlays (6)
          openqms validate --module aerospace --module aerospace-defense
          openqms validate --module aerospace --module aerospace-commercial-space
          openqms validate --module automotive --module automotive-defense
          openqms validate --module automotive --module automotive-motorcycle
          openqms validate --module medical-devices --module ivd --module ivdr-class-c
          openqms validate --module medical-devices --module ivd --module ivdr-class-d
          # Top-rigor mega-composite — safety-critical + cyber-critical ML-enabled ECU
          openqms validate --module automotive --module automotive-asil-d --module automotive-cal-4 --module regulated-ai --module iso-27001
          # Full-stack mega-composite — manufacturing + all 5 cross-cutting management-system overlays
          openqms validate --module manufacturing --module iso-14001 --module iso-45001 --module iso-50001 --module iso-27001 --module regulated-ai
          # v0.36.0 — chemicals vertical (7th vertical) + composites
          openqms validate --module chemicals
          openqms validate --module chemicals --module iso-27001
          openqms validate --module chemicals --module iso-14001 --module iso-45001
          openqms validate --module chemicals --module iso-14001 --module iso-45001 --module iso-50001 --module iso-27001 --module regulated-ai
          # Chemicals full-IMS deepest-composite — REACH/CLP/GHS/GLP/TSCA + 8 cross-cutting overlays
          openqms validate --module chemicals --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000
          # v0.37.0 — chemicals-adjacent standalones (4 cross-cutting overlays)
          openqms validate --module osha-hcs
          openqms validate --module transport-hazmat
          openqms validate --module eu-biocides
          openqms validate --module tsca-pfas
          openqms validate --module chemicals --module osha-hcs
          openqms validate --module chemicals --module transport-hazmat
          openqms validate --module chemicals --module eu-biocides
          openqms validate --module chemicals --module tsca-pfas
          openqms validate --module chemicals --module osha-hcs --module transport-hazmat --module eu-biocides --module tsca-pfas
          openqms validate --module automotive --module transport-hazmat --module tsca-pfas
          openqms validate --module pharma --module osha-hcs --module transport-hazmat
          # Chemicals + all chemicals-adjacent + full IMS — 13-module deepest-composite
          openqms validate --module chemicals --module osha-hcs --module transport-hazmat --module eu-biocides --module tsca-pfas --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000
          # v0.38.0 — chemicals class overlays (6: SVHC + Authorisation + 4 tonnage bands)
          openqms validate --module chemicals-svhc
          openqms validate --module chemicals-authorisation
          openqms validate --module chemicals-tonnage-1
          openqms validate --module chemicals-tonnage-10
          openqms validate --module chemicals-tonnage-100
          openqms validate --module chemicals-tonnage-1000
          openqms validate --module chemicals --module chemicals-svhc
          openqms validate --module chemicals --module chemicals-authorisation
          openqms validate --module chemicals --module chemicals-tonnage-10
          openqms validate --module chemicals --module chemicals-tonnage-1000
          openqms validate --module chemicals --module chemicals-svhc --module chemicals-authorisation --module chemicals-tonnage-1000
          # Chemicals top-rigor mega-composite — vertical + SVHC + Authorisation + top tonnage + adjacent + full IMS (16-module new depth)
          openqms validate --module chemicals --module chemicals-svhc --module chemicals-authorisation --module chemicals-tonnage-1000 --module osha-hcs --module transport-hazmat --module eu-biocides --module tsca-pfas --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000
          # v0.41.0 — privacy cross-cutting overlay (GDPR + CCPA)
          openqms validate --module privacy
          openqms validate --module medical-devices --module privacy
          openqms validate --module pharma --module privacy
          openqms validate --module automotive --module privacy
          openqms validate --module food-safety --module privacy
          openqms validate --module chemicals --module privacy
          openqms validate --module manufacturing --module privacy
          openqms validate --module aerospace --module privacy
          openqms validate --module privacy --module iso-27001 --module regulated-ai
          openqms validate --module privacy --module soc-2 --module hitrust-csf --module iso-27001
          # 17-module ultimate composite — chemicals top-rigor + adjacent + IMS + privacy
          openqms validate --module chemicals --module chemicals-svhc --module chemicals-authorisation --module chemicals-tonnage-1000 --module osha-hcs --module transport-hazmat --module eu-biocides --module tsca-pfas --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000 --module privacy
          # v0.42.0 — sub-overlay batch (16): CMMC levels 1/2/3 + SOC 2 Type I/II + ISO 27001 extensions 27017 cloud + 27701 PIMS + NIST CSF tiers 1/2/3/4 + PCI DSS SAQ types A/A-EP/D-Merchant/D-SP/P2PE
          openqms validate --module cmmc-level-1
          openqms validate --module cmmc-level-2
          openqms validate --module cmmc-level-3
          openqms validate --module soc-2-type-i
          openqms validate --module soc-2-type-ii
          openqms validate --module iso-27001-cloud
          openqms validate --module iso-27001-privacy
          openqms validate --module nist-csf-tier-1
          openqms validate --module nist-csf-tier-2
          openqms validate --module nist-csf-tier-3
          openqms validate --module nist-csf-tier-4
          openqms validate --module pci-dss-saq-a
          openqms validate --module pci-dss-saq-a-ep
          openqms validate --module pci-dss-saq-d-merchant
          openqms validate --module pci-dss-saq-d-sp
          openqms validate --module pci-dss-saq-p2pe
          openqms validate --module defense-cui --module cmmc --module cmmc-level-1
          openqms validate --module defense-cui --module cmmc --module cmmc-level-2
          openqms validate --module defense-cui --module cmmc --module cmmc-level-2 --module cmmc-level-3
          openqms validate --module soc-2 --module soc-2-type-i
          openqms validate --module soc-2 --module soc-2-type-ii
          openqms validate --module iso-27001 --module iso-27001-cloud --module iso-27001-privacy --module privacy
          openqms validate --module nist-csf --module nist-csf-tier-3
          openqms validate --module pci-dss --module pci-dss-saq-d-merchant
          openqms validate --module pci-dss --module pci-dss-saq-a-ep
          openqms validate --module pci-dss --module pci-dss-saq-d-sp
          # v0.43.0 — sub-overlay batch (10): DORA tiers (CTPP / non-CTPP / TLPT) + HITRUST scoping levels (e1 / i1 / r2) + ISO 37301 sectoral profiles (public-sector / financial-services / healthcare / general-business)
          openqms validate --module dora-ctpp
          openqms validate --module dora-non-ctpp
          openqms validate --module dora-tlpt
          openqms validate --module hitrust-e1
          openqms validate --module hitrust-i1
          openqms validate --module hitrust-r2
          openqms validate --module iso-37301-public-sector
          openqms validate --module iso-37301-financial-services
          openqms validate --module iso-37301-healthcare
          openqms validate --module iso-37301-general-business
          openqms validate --module dora --module dora-ctpp --module dora-tlpt
          openqms validate --module dora --module dora-non-ctpp
          openqms validate --module hitrust-csf --module hitrust-r2
          openqms validate --module iso-37301 --module iso-37301-financial-services --module dora --module dora-non-ctpp
          openqms validate --module iso-37301 --module iso-37301-healthcare --module privacy --module hitrust-csf --module hitrust-r2
          # 19-module deepest composite — chemicals top-rigor + adjacent + IMS + privacy + ISO 27001 cloud + PIMS
          openqms validate --module chemicals --module chemicals-svhc --module chemicals-authorisation --module chemicals-tonnage-1000 --module osha-hcs --module transport-hazmat --module eu-biocides --module tsca-pfas --module iso-27001 --module iso-27001-cloud --module iso-27001-privacy --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000 --module privacy
          # v0.44.0 — cross-overlay batch (3): combination-product (medical-devices + pharma) + integrated-management-system (multi-MS) + food-pharma-grade (chemicals + food-safety + pharma)
          openqms validate --module combination-product
          openqms validate --module integrated-management-system
          openqms validate --module food-pharma-grade
          openqms validate --module medical-devices --module pharma --module combination-product
          openqms validate --module medical-devices --module pharma --module pharma-sterile --module combination-product
          openqms validate --module pharma --module iso-27001 --module iso-14001 --module iso-45001 --module iso-50001 --module integrated-management-system
          openqms validate --module chemicals --module iso-27001 --module iso-14001 --module iso-45001 --module iso-50001 --module iso-31000 --module integrated-management-system
          openqms validate --module chemicals --module food-safety --module pharma --module food-pharma-grade
          openqms validate --module chemicals --module food-pharma-grade
          # 20-module ultimate composite — pharma + combination-product + IMS + chemicals + food-pharma-grade + privacy + everything
          openqms validate --module medical-devices --module pharma --module combination-product --module pharma-sterile --module privacy --module iso-27001 --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000 --module integrated-management-system --module soc-2 --module soc-2-type-ii --module hitrust-csf --module hitrust-r2 --module iso-27001-cloud --module iso-27001-privacy
          # v0.45.0 — HIPAA dedicated cross-cutting overlay
          openqms validate --module hipaa
          openqms validate --module hipaa --module privacy
          openqms validate --module medical-devices --module hipaa --module privacy --module iso-27001
          openqms validate --module pharma --module hipaa --module privacy
          openqms validate --module hipaa --module hitrust-csf --module hitrust-r2 --module soc-2 --module soc-2-type-ii
          openqms validate --module hipaa --module iso-27001 --module iso-27001-privacy --module privacy
          openqms validate --module hipaa --module iso-37301 --module iso-37301-healthcare --module privacy
          # 22-module healthcare ultimate composite — medical-devices + pharma + combination-product + HIPAA + privacy + IMS + HITRUST + everything
          openqms validate --module medical-devices --module pharma --module combination-product --module pharma-sterile --module hipaa --module privacy --module iso-27001 --module iso-27001-cloud --module iso-27001-privacy --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000 --module integrated-management-system --module soc-2 --module soc-2-type-ii --module hitrust-csf --module hitrust-r2 --module iso-37301
          # v0.47.0 — cross-overlay batch (5): connected-medical-device + cell-therapy-supply-chain + food-allergen-recall + defense-aerospace-cyber + digital-health-multi-region
          openqms validate --module connected-medical-device
          openqms validate --module cell-therapy-supply-chain
          openqms validate --module food-allergen-recall
          openqms validate --module defense-aerospace-cyber
          openqms validate --module digital-health-multi-region
          openqms validate --module medical-devices --module regulated-ai --module privacy --module iso-27001 --module hipaa --module connected-medical-device
          openqms validate --module pharma --module atmp --module transport-hazmat --module cell-therapy-supply-chain
          openqms validate --module food-safety --module recall-workflow --module privacy --module food-allergen-recall
          openqms validate --module aerospace --module aerospace-defense --module defense-cui --module cmmc --module cmmc-level-2 --module defense-aerospace-cyber
          openqms validate --module medical-devices --module privacy --module regulated-ai --module hipaa --module digital-health-multi-region
          # 24-module ultra composite — medical-devices + pharma + connected-medical-device + digital-health-multi-region + HIPAA + everything
          openqms validate --module medical-devices --module pharma --module combination-product --module connected-medical-device --module digital-health-multi-region --module pharma-sterile --module hipaa --module privacy --module iso-27001 --module iso-27001-cloud --module iso-27001-privacy --module regulated-ai --module iso-14001 --module iso-45001 --module iso-50001 --module iso-37001 --module iso-22301 --module iso-31000 --module integrated-management-system --module soc-2 --module soc-2-type-ii --module hitrust-csf --module hitrust-r2 --module iso-37301
          # v0.48.0 — US state-privacy umbrella cross-cutting overlay (26th cross-cutting; VCDPA template family covering ~14 US states)
          openqms validate --module us-state-privacy
          openqms validate --module privacy --module us-state-privacy
          openqms validate --module hipaa --module privacy --module us-state-privacy
          openqms validate --module medical-devices --module privacy --module us-state-privacy --module hipaa --module iso-27001
          openqms validate --module privacy --module us-state-privacy --module hipaa --module iso-27001 --module iso-27001-privacy --module hitrust-csf --module hitrust-r2
          # v0.50.0 — final cross-overlay batch
          openqms validate --module automotive-supply-chain
          openqms validate --module clinical-trial-multi-region
          openqms validate --module banking-resilience
          openqms validate --module utility-cybersecurity
          openqms validate --module automotive --module automotive-asil-d --module automotive-cal-4 --module recall-workflow --module automotive-supply-chain
          openqms validate --module pharma --module privacy --module hipaa --module digital-health-multi-region --module clinical-trial-multi-region
          openqms validate --module iso-37301 --module iso-37301-financial-services --module dora --module dora-non-ctpp --module nist-csf --module nist-csf-tier-3 --module iso-22301 --module banking-resilience
          openqms validate --module manufacturing --module iso-27001 --module nist-csf --module nist-csf-tier-3 --module utility-cybersecurity
          # P2.1 — validation-package baseline (risk-based computerized-system validation; CSA-framed, CSV = robust-scripted tier)
          openqms validate --module validation-package
          openqms validate --module medical-devices --module validation-package
          openqms validate --module pharma --module validation-package
          openqms validate --module medical-devices --module validation-package --module iso-27001 --module regulated-ai

      - name: Coverage report (smoke check + repo-wide invariant)
        # v0.49.0 — `openqms coverage` per-module + aggregate coverage metrics.
        # Asserts aggregate clause-coverage = 100% (every clause bound to
        # at least one template); paired with the zero-orphan trace check.
        run: |
          openqms coverage --all --output /tmp/openqms-coverage.json
          python3 -c "import json; d=json.load(open('/tmp/openqms-coverage.json')); s=d['summary']; assert s['aggregate_clause_coverage_pct']==100.0, f'coverage regression: {s}'; print(f'coverage ok — {s[\"modules_in_scope\"]} modules / aggregate {s[\"aggregate_clause_coverage_pct\"]}%')"

      - name: Crosswalk smoke check
        # v0.49.0 — `openqms crosswalk` between privacy + us-state-privacy +
        # hipaa (three US-privacy-adjacent overlays). Exercises the new
        # CLI surface; output not gated.
        run: |
          openqms crosswalk --module privacy --module us-state-privacy --module hipaa --format md > /tmp/openqms-crosswalk-privacy.md
          echo "crosswalk privacy+us-state-privacy+hipaa: $(wc -l < /tmp/openqms-crosswalk-privacy.md) lines"

      - name: Jurisdictions query smoke check
        # v0.49.0 — `openqms jurisdictions-query` publisher-inferred lookup.
        # Asserts FDA + EU MDR return >=1 standards each.
        run: |
          fda_count=$(openqms jurisdictions-query --jurisdiction FDA --format json | python3 -c "import json,sys; print(json.load(sys.stdin)['match_count'])")
          eu_count=$(openqms jurisdictions-query --jurisdiction "EU MDR" --format json | python3 -c "import json,sys; print(json.load(sys.stdin)['match_count'])")
          test "$fda_count" -gt 0 || (echo "FDA jurisdiction query returned 0; expected >0"; exit 1)
          test "$eu_count" -gt 0 || (echo "EU MDR jurisdiction query returned 0; expected >0"; exit 1)
          echo "jurisdictions-query ok — FDA=$fda_count standards, EU MDR=$eu_count standards"

      - name: Inspect registry (smoke check)
        run: openqms registry list

      - name: Regenerate example bundles (dry-run regression check)
        # Exits 1 if any matrix has drifted from its committed baseline.
        # If this fails, either revert the offending module/registry/template
        # change or run `openqms regenerate --bundle <name> --write-matrix`
        # and commit the resulting matrix file.
        run: |
          openqms regenerate --bundle example-samd
          openqms regenerate --bundle example-aircraft
          openqms regenerate --bundle example-vehicle
          openqms regenerate --bundle example-machine-shop
          openqms regenerate --bundle example-drug-product
          openqms regenerate --bundle example-food-processor
          openqms regenerate --bundle example-cart
          openqms regenerate --bundle example-specialty-chemical

      - name: Regenerate startup-stage presets (dry-run regression check)
        # v0.61.0 (P4) — same gating as example bundles, applied to the
        # 4 startup-stage presets at presets/. Exits 1 if any preset's
        # matrix has drifted; operator either reverts the offending
        # change or runs `openqms regenerate --bundle presets/<name>.yaml
        # --write-matrix` and commits the new matrix.
        run: |
          openqms regenerate --bundle presets/pre-seed.yaml
          openqms regenerate --bundle presets/seed.yaml
          openqms regenerate --bundle presets/series-a.yaml
          openqms regenerate --bundle presets/series-b-plus.yaml

      - name: Repo-wide trace matrix (smoke check + zero-orphan invariant)
        # Walks every module and asserts: (i) the command runs cleanly,
        # (ii) the repo-wide invariant holds — zero orphaned clauses and
        # zero orphaned templates across every shipped module (OQ-067 +
        # OQ-001 at scale).
        run: |
          openqms trace --all --output /tmp/openqms-trace.json
          python3 -c "import json; d=json.load(open('/tmp/openqms-trace.json')); s=d['summary']; assert s['orphaned_clauses_total']==0, f'orphaned clauses: {s}'; assert s['orphaned_templates_total']==0, f'orphaned templates: {s}'; print(f'trace ok — {s[\"modules_in_scope\"]} modules / {s[\"total_clauses\"]} clauses / {s[\"total_templates\"]} templates / 0 orphans')"

      - name: Signatures export (smoke check)
        # Walks the repo's own git log and emits a signature audit trail.
        # OpenQMS doesn't enforce Signature-Meaning trailers on its own
        # commits today, so the trail may be empty — this step exercises
        # the engine code path and surfaces parse errors.
        run: openqms signatures export --output /tmp/openqms-signatures.json
