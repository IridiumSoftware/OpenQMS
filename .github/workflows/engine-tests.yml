name: Engine tests

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'modules/**'
      - 'templates/**'
      - 'registry/**'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'modules/**'
      - 'templates/**'
      - 'registry/**'
      - '.github/workflows/engine-tests.yml'

jobs:
  test:
    name: pytest + module validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e './engine[dev]'

      - name: Run pytest
        run: pytest engine/tests -v

      - name: Validate shipped regulatory modules
        run: |
          openqms validate --module medical-devices
          openqms validate --module iso-27001
          openqms validate --module medical-devices --module iso-27001

      - name: Inspect registry (smoke check)
        run: openqms registry list
