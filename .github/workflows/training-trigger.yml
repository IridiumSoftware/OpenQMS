name: Training Trigger

on:
  push:
    branches: [main]
    paths:
      - 'qms-sops/**'
      - 'qms-policy/**'

jobs:
  create-training-issues:
    name: Create training assignments
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --no-cache-dir 'pyyaml>=6.0'

      - name: Identify changed controlled documents
        id: changed
        run: |
          changed_files=$(git diff --name-only HEAD~1 HEAD -- 'qms-sops/' 'qms-policy/' | grep '\.md$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -z "$changed_files" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Parse training config and document frontmatter
        id: parse
        if: steps.changed.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 <<'PYEOF'
          import json, os, sys, yaml, pathlib

          # Parse trainees from docs/qms-config.yml using a real YAML parser
          # (replaces the regex-based parsing this workflow used pre-v0.1.2).
          config_path = pathlib.Path("docs/qms-config.yml")
          config_present = config_path.exists()
          trainees = []
          if config_present:
              try:
                  config = yaml.safe_load(config_path.read_text()) or {}
                  raw = config.get("trainees", [])
                  if isinstance(raw, list):
                      trainees = [str(t).strip() for t in raw if str(t).strip()]
                  else:
                      print(
                          "::warning::docs/qms-config.yml 'trainees' key is not a list; ignoring.",
                          file=sys.stderr,
                      )
              except yaml.YAMLError as e:
                  print(
                      f"::warning::Failed to parse docs/qms-config.yml: {e}",
                      file=sys.stderr,
                  )

          # Parse frontmatter title for each changed file (handles quoted strings,
          # block scalars, nested mappings — anything PyYAML can load).
          changed_raw = os.environ.get("CHANGED_FILES", "")
          changed_files = [line for line in changed_raw.splitlines() if line.strip()]
          docs = []
          for f in changed_files:
              p = pathlib.Path(f)
              title = p.stem
              if p.exists():
                  text = p.read_text()
                  if text.startswith("---\n"):
                      end = text.find("\n---", 4)
                      if end != -1:
                          try:
                              meta = yaml.safe_load(text[4:end]) or {}
                              if isinstance(meta, dict) and "title" in meta:
                                  title = str(meta["title"])
                          except yaml.YAMLError:
                              pass
              docs.append({"file": f, "title": title})

          payload = {
              "config_present": config_present,
              "trainees": trainees,
              "docs": docs,
          }

          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a") as fh:
                  fh.write("payload=" + json.dumps(payload) + "\n")
          else:
              print(json.dumps(payload))
          PYEOF

      - name: Create training issues
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        env:
          PAYLOAD: ${{ steps.parse.outputs.payload }}
        with:
          script: |
            const payload = JSON.parse(process.env.PAYLOAD || '{}');
            const configPresent = !!payload.config_present;
            const trainees = payload.trainees || [];
            const docs = payload.docs || [];

            if (!configPresent) {
              core.warning(
                'No docs/qms-config.yml found. Skipping trainee-specific issues. ' +
                'Configure docs/qms-config.yml to enable.'
              );
              return;
            }

            const commit = context.sha.substring(0, 7);

            for (const d of docs) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Training Required: ${d.title} (rev ${commit})`,
                body: [
                  `## Training Assignment`,
                  '',
                  `**Document:** \`${d.file}\``,
                  `**Revision:** ${commit}`,
                  `**Trigger:** Document updated on main branch`,
                  '',
                  `### Required action`,
                  '',
                  `Review the updated document and confirm training completion by checking the box below and closing this issue.`,
                  '',
                  `- [ ] I have read and understood the updated document`,
                  '',
                  `### Trainees`,
                  '',
                  trainees.length > 0
                    ? trainees.map(t => `- @${t}`).join('\n')
                    : '_Configure trainees in docs/qms-config.yml_',
                ].join('\n'),
                labels: ['training', 'auto-generated'],
              });

              core.info(`Created training issue for: ${d.file}`);
            }
