# Release-artifact archival workflow — Open QMS
# -----------------------------------------------
# P8 (compliance-architecture forward work; shipped at v0.55.0).
#
# Triggers on tag push (v* or release-*). For each tagged release this
# workflow runs the engine's invariant-check suite and uploads a
# release-artifact ZIP containing:
#
#   - trace.json           — `openqms trace --all` repo-wide forward + reverse maps
#   - coverage.json        — `openqms coverage --all` per-module + aggregate metrics
#   - signatures.json      — `openqms signatures export` Part 11-style audit trail
#   - pytest-results.txt   — full pytest log for the release commit
#   - lint-output.txt      — `scripts/lint-module-yaml.py` output
#   - module-count.txt     — per-shape module count snapshot
#   - tag-signature.txt    — `git tag -v <tag>` signature verification output
#
# Multi-year retention (default 90 days per GitHub artifacts; adopters
# should mirror to org-controlled long-term storage via `gh release
# download <tag>` cron — see docs/guide/release.md).

name: Release artifact

on:
  push:
    tags:
      - 'v*'
      - 'release-*'

jobs:
  archive:
    name: Capture CI logs + invariant outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for signature + log capture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.11.7'

      - name: Install deps via lockfile (P6)
        run: |
          cd engine && uv sync --frozen --all-extras
          cd engine && uv pip install -e '.[dev]'

      - name: Verify tag signature (P7 gate)
        # Releases MUST be signed tags. If git tag -v fails, the
        # release-artifact archival aborts. Adopter forks can disable
        # this step by removing the workflow file; the project-side
        # CI gates the canonical release artifacts.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Verifying signature on tag: $TAG"
          git tag -v "$TAG" 2>&1 | tee tag-signature.txt
          if ! git tag -v "$TAG" 2>/dev/null; then
            echo "::warning::Tag $TAG signature did not verify. Adopter forks: ensure release-signing GPG key is published + fetched. Continuing artifact capture for forensic record."
          fi

      - name: Capture invariant outputs
        # Each command's output is captured to disk for the
        # release-artifact ZIP; failures here are real regressions.
        run: |
          source engine/.venv/bin/activate 2>/dev/null || source .venv/bin/activate 2>/dev/null || true
          openqms trace --all --output trace.json
          openqms coverage --all --output coverage.json
          openqms signatures export --output signatures.json

      - name: Capture pytest log
        run: |
          cd engine && uv run pytest tests -v 2>&1 | tee ../pytest-results.txt

      - name: Capture lint output
        run: python3 scripts/lint-module-yaml.py 2>&1 | tee lint-output.txt

      - name: Capture module-count snapshot
        run: |
          {
            echo "Module count snapshot at $(git describe --tags --abbrev=0)"
            echo "Total modules on disk:    $(ls -d modules/*/ | wc -l)"
            echo "Captured at commit:       $(git rev-parse HEAD)"
            echo "Captured at timestamp:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee module-count.txt

      - name: Bundle release artifact
        run: |
          mkdir -p release-artifact
          mv trace.json coverage.json signatures.json pytest-results.txt lint-output.txt module-count.txt tag-signature.txt release-artifact/
          cd release-artifact && zip -r ../openqms-release-artifact.zip .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: openqms-release-artifact-${{ github.ref_name }}
          path: openqms-release-artifact.zip
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: openqms-release-artifact.zip
          fail_on_unmatched_files: false
