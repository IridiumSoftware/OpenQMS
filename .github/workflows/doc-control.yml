name: Document Control

# P5 hardening — rewritten at v0.60.0 to replace shell/grep parsing with
# PyYAML schema-validated parsing, hard-fail version drift, enforce
# state-transition rules, and emit a signed audit artifact per PR.
# See engine/openqms/doc_control.py + docs/guide/doc-control.md.

on:
  pull_request:
    paths:
      - 'qms-policy/**'
      - 'qms-sops/**'
      - 'qms-forms/**'
      - 'qms-training/**'
      - 'product-*/design-*/**'
      - 'product-*/risk-management/**'
      - 'product-*/technical-file/**'
      - '!**/*.json'

jobs:
  check:
    name: Doc-control state-machine + version-drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # for posting audit comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for base-ref comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.11.7'

      - name: Install engine via lockfile
        run: |
          cd engine && uv sync --frozen --all-extras
          cd engine && uv pip install -e '.'

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.md

      - name: Run doc-control checks
        # The script parses changed files via PyYAML (no more shell/grep),
        # runs the state-machine + version-drift checks, parses
        # Signature-Meaning trailers from the PR commits, and writes an
        # audit-artifact JSON + Markdown.
        # Exits 1 on any error (hard-fail mode — change from v0.55.0 era
        # warning-only).
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "${{ steps.changed.outputs.all_changed_files }}" | tr ' ' '\n' > /tmp/changed-files.txt
          python3 scripts/doc-control-check.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref HEAD \
            --commit-sha "${{ github.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --changed-files /tmp/changed-files.txt \
            --output doc-control-audit.json \
            --markdown-output doc-control-audit.md \
            --ci-status pending

      - name: Upload audit artifact
        if: always() && steps.changed.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doc-control-audit-${{ github.event.pull_request.number }}
          path: |
            doc-control-audit.json
            doc-control-audit.md
          retention-days: 90

      - name: Post audit summary to PR
        if: always() && steps.changed.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f doc-control-audit.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file doc-control-audit.md \
              || echo "::warning::Could not post audit comment (gh pr comment failed)"
          fi

  check-approvers:
    name: Verify CODEOWNERS coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CODEOWNERS coverage
        run: |
          if [ ! -f CODEOWNERS ] && [ ! -f .github/CODEOWNERS ]; then
            echo "::error::No CODEOWNERS file found. Required for document approval routing."
            exit 1
          fi

          codeowners_file="CODEOWNERS"
          [ -f ".github/CODEOWNERS" ] && codeowners_file=".github/CODEOWNERS"

          required_paths=("qms-policy/" "qms-sops/" "qms-forms/" "qms-training/")
          for path in "${required_paths[@]}"; do
            if ! grep -q "$path" "$codeowners_file"; then
              echo "::warning::Path '$path' has no CODEOWNERS entry. Documents here won't require specific approvers."
            fi
          done
