name: Signature meaning check

# 21 CFR Part 11 §11.50 signature-meaning enforcement (OQ-060).
#
# Gates PRs touching controlled-document paths (qms-policy/, qms-sops/).
# Requires every commit in the PR's range to declare Signature-Meaning in
# its commit message. Dormant in the OpenQMS repository itself (no
# controlled documents at those paths); active in adopter forks.
#
# To require GPG verification in addition, change `--require-gpg` from
# commented to active in the verify step below — after the adopter
# organization has GPG signing enforced per docs/guide/gpg-signing.md.

on:
  pull_request:
    paths:
      - 'qms-policy/**'
      - 'qms-sops/**'
      - 'qms-forms/**'
      - 'qms-training/**'
      - 'product-*/**'

jobs:
  signature-meaning:
    name: Verify Signature-Meaning trailer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e './engine'

      - name: Verify every commit in PR carries Signature-Meaning
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          for sha in $(git rev-list --reverse "$base..$head"); do
            if ! openqms signatures verify --commit "$sha" > /tmp/verify.out 2>&1; then
              echo "::error::Commit $sha is missing the Signature-Meaning trailer."
              cat /tmp/verify.out
              failed=1
            fi
          done
          # To upgrade to GPG-required:
          #   openqms signatures verify --commit "$sha" --require-gpg
          exit $failed
