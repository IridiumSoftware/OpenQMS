[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openqms"
version = "0.59.0"
description = "Open QMS — generator for regulated-industry Quality Management Systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Aaron Green" },
]
keywords = [
  "qms",
  "quality-management",
  "regulatory",
  "medical-devices",
  "iso-13485",
  "21-cfr-820",
  "aerospace",
  "as9100",
  "do-178c",
  "automotive",
  "iatf-16949",
  "iso-26262",
  "iso-21434",
  "manufacturing",
  "iso-9001",
  "machine-shop",
  "iso-14001",
  "iso-45001",
  "iso-50001",
  "environmental-management",
  "occupational-health-safety",
  "energy-management",
  "pharma",
  "gmp",
  "ich-q10",
  "ich-q7",
  "cgmp",
  "eudralex",
  "pic-s-annex-1",
  "food-safety",
  "iso-22000",
  "fssc-22000",
  "haccp",
  "fsma",
  "iso-37001",
  "anti-bribery",
  "iso-22301",
  "business-continuity",
  "atmp",
  "cell-therapy",
  "gene-therapy",
  "car-t",
  "ich-q5a",
  "hct-p",
  "recall",
  "nhtsa",
  "cfr-573",
  "cfr-806",
  "cpsia",
  "tread-act",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
openqms = "openqms.cli:main"

[project.urls]
Repository = "https://github.com/IridiumSoftware/OpenQMS"

[tool.hatch.build.targets.wheel]
packages = ["openqms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
