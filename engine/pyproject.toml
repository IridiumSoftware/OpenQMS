[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openqms"
version = "0.6.0"
description = "Open QMS — generator for regulated-industry Quality Management Systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Aaron Green" },
]
keywords = [
  "qms",
  "quality-management",
  "regulatory",
  "medical-devices",
  "iso-13485",
  "21-cfr-820",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openqms = "openqms.cli:main"

[project.urls]
Repository = "https://github.com/IridiumSoftware/OpenQMS"

[tool.hatch.build.targets.wheel]
packages = ["openqms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
